<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Palle Natural Foods • Village Fresh Delivery</title>
    <meta name="description" content="Hyperlocal unadulterated village milk, freshwater fish and pasture-fed mutton delivered fresh to your apartment flat door in HMT Nagar." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#1b4332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Palle Foods" />
    <link rel="apple-touch-icon" href="/assets/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Ramabhadra&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
  </head>
  <body class="bg-[#f5f3ef] text-[#222521] antialiased select-none">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
